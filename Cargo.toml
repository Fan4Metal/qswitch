[package]
# The identifier: the exe, the Cargo package, the GitHub repository, the
# single-instance names. The display name is the same ("qswitch", as qview
# and qrec): main.rs, setup.iss, build.rs and the READMEs.
name = "qswitch"
# Between releases: the next version with "-dev", the last number raised by
# one (after 0.1.0, "0.1.1-dev"); a release drops it.
version = "0.1.0-dev"
authors = ["Fan4_Metal"]
edition = "2024"
# One sentence, English: it is shown in About, in the exe's version
# resource (build.rs) and as the README tagline.
description = "Fast keyboard layout switcher: double Shift converts what you have just typed into the other layout"
license = "MIT"
repository = "https://github.com/Fan4Metal/qswitch"

[dependencies]
# glow, not the default wgpu: a smaller binary and a faster start (an OpenGL
# context is created in ~130 ms against ~240 ms for wgpu on DX12). eframe's
# default features are off: no accesskit, no wgpu, no `links` (URLs are
# opened through win::shell_open) and no `persistence`: the window's place
# is kept in the JSON settings with everything else (settings.rs).
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"
# The settings file (%APPDATA%\qswitch\config\settings.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[target.'cfg(windows)'.dependencies]
# Keep the feature list minimal; add a feature only for an API that is used.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",            # GetUserDefaultUILanguage (i18n), layout names (layout.rs)
    "Win32_Graphics_Gdi",             # WNDCLASSW (one instance), the tray icon's letters (tray.rs)
    "Win32_Networking_WinHttp",       # the update check
    "Win32_Security",                 # CreateMutexW's attributes (one instance), elevation
    "Win32_System_Console",           # AttachConsole for the command line modes
    "Win32_System_DataExchange",      # WM_COPYDATA (one instance)
    "Win32_System_LibraryLoader",     # GetModuleHandleW (one instance, the hooks)
    "Win32_System_Registry",          # the Run key (autostart.rs)
    "Win32_System_Threading",         # CreateMutexW, the hook thread, the foreground exe (rules)
    "Win32_UI_Accessibility",         # SetWinEventHook: foreground and focus changes (hook.rs)
    "Win32_UI_Input_KeyboardAndMouse",# layouts, ToUnicodeEx, SendInput (layout.rs, hook.rs)
    "Win32_UI_Shell",                 # ShellExecuteW, Shell_NotifyIconW, SetWindowSubclass
    "Win32_UI_WindowsAndMessaging",   # windows, hooks, messages
] }

# UI Automation (COM interfaces) for the selected text (selection.rs);
# windows-sys stays for the rest.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",               # SafeArrayDestroy (caret.rs)
    "Win32_System_Variant",           # IAccessible::accLocation (caret.rs)
    "Win32_UI_Accessibility",
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and the version information into the exe.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic ends the process; main::install_panic_hook shows it first.
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Dependencies optimised in debug builds too, so that a debug build is usable.
[profile.dev.package."*"]
opt-level = 3
